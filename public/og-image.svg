<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(108,99,255,0.15)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent line -->
  <rect x="80" y="260" width="120" height="3" fill="url(#accent)" rx="2"/>
  <!-- Name -->
  <text x="80" y="320" font-family="system-ui,sans-serif" font-size="80" font-weight="900" fill="#F0F0F5" letter-spacing="-2">Bishal Kumar</text>
  <!-- Role -->
  <text x="80" y="390" font-family="system-ui,sans-serif" font-size="28" font-weight="500" fill="#6B6B7B" letter-spacing="0">Senior Frontend Developer · React · Next.js · TypeScript</text>
  <!-- BK monogram -->
  <rect x="1060" y="250" width="64" height="64" rx="12" fill="rgba(108,99,255,0.15)" stroke="rgba(108,99,255,0.4)" stroke-width="1.5"/>
  <text x="1092" y="291" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#6C63FF" text-anchor="middle" letter-spacing="1">BK</text>
  <!-- Stats row -->
  <text x="80" y="480" font-family="system-ui,sans-serif" font-size="18" fill="rgba(108,99,255,0.9)" letter-spacing="3">4 PATENTS  ·  2 RESEARCH PAPERS  ·  2K+ STUDENTS MENTORED</text>
</svg>
